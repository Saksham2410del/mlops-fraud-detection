# Runs the API together with Ollama (which serves Llama 3.2).
#
#   docker compose up --build
#   docker compose exec ollama ollama pull llama3.2   # first time only

services:
  api:
    build: .
    container_name: fraudguard-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: fraudguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
