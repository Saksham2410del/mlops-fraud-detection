# DVC pipeline: `dvc repro` runs only the stages whose inputs changed.
# `dvc dag` shows the order, `dvc metrics show` prints the latest scores.

stages:
  preprocess:
    cmd: python -m src.preprocess
    deps:
      - data/raw/PS_20174392719_1491204439457_log.csv
      - src/preprocess.py
      - src/features.py
      - src/config.py
    outs:
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv

  train:
    cmd: python -m src.train
    deps:
      - data/processed/X_train.csv
      - data/processed/y_train.csv
      - src/train.py
    outs:
      - models/xgboost_fraud.joblib:
          cache: false   # keep the trained model in git so the API works out of the box

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - models/xgboost_fraud.joblib
      - data/processed/X_test.csv
      - data/processed/y_test.csv
      - src/evaluate.py
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/confusion_matrix.png:
          cache: false
      - reports/feature_importance.png:
          cache: false
